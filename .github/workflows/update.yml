name: Update TW Institutional Data

on:
  schedule:
    # 改為：台北時間 09:15, 10:15, 11:15, 12:15 啟動 (避開 30分 的塞車潮)
    # UTC 01:15 = 台北 09:15
    - cron: "15 1,2,3,4 * * 1-5"
    
    # 盤後維持不變 (台北 18:30 / UTC 10:30)
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 移除 pandas_ta，保留必要的資料處理與 HTML 解析套件
          pip install requests pandas openpyxl lxml html5lib
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Playwright browsers
        run: |
          python -m pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run update_all.py
        run: python update_all.py

      - name: Run update_broker.py
        run: python update_broker.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if ! git diff --cached --quiet; then
            git commit -m "chore: update data via GitHub Actions"
            git push -f
          else
            echo "No changes to commit."
          fi
