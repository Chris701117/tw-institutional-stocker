name: Update TW Institutional Data

on:
  # 1. 定時排程 (GitHub 內建鬧鐘)
  schedule:
    # 平日 (週一~週五)：每 20 分鐘執行一次盤中監控 (UTC 01:00 ~ 06:00)
    - cron: "*/20 1-6 * * 1-5"
    
    # 平日 (週一~週五)：下午 17:00 執行盤後結算 (UTC 09:00)
    - cron: "00 09 * * 1-5"
    
    # 🔥【修正重點】週六：只在下午 15:00 執行一次集保大戶 (UTC 07:00)
    # 這樣才不會反覆執行導致資料被覆蓋成 0
    - cron: "00 07 * * 6"

  # 2. 手動按鈕
  workflow_dispatch: {}

  # 3. 外部遙控 (給 GAS 用的)
  repository_dispatch:
    types: [run-now, run-weekly]

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl lxml html5lib yfinance playwright
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 只有在下午 17:00 的排程才安裝 Playwright
      - name: Install Playwright browsers
        if: github.event.schedule == '00 09 * * 1-5'
        run: |
          playwright install chromium
          playwright install-deps chromium

      # 執行主程式
      - name: Run Main Script (update_all.py)
        run: python update_all.py

      # (平日盤後) 跑券商分點
      - name: Run update_broker.py
        if: github.event.schedule == '00 09 * * 1-5'
        run: python update_broker.py

      # 提交變更
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: update data via GitHub Actions"
            git push
          else
            echo "No changes to commit."
          fi
