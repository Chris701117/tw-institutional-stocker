name: Update TW Institutional Data

on:
  schedule:
    # 台北時間週一至週五盤中定時偵測 (UTC+8)
    # 01:30 UTC = 09:30 台北
    # 02:30 UTC = 10:30 台北
    # 03:30 UTC = 11:30 台北
    # 04:30 UTC = 12:30 台北
    - cron: "30 1,2,3,4 * * 1-5"
    # 台北時間週一至週五 18:30 盤後正式更新 (10:30 UTC)
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 強制安裝 lxml 與 html5lib 以支援 pd.read_html
          pip install requests pandas pandas_ta openpyxl lxml html5lib
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Playwright browsers
        run: |
          python -m pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run update_all.py
        run: python update_all.py

      - name: Run update_broker.py
        run: python update_broker.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if ! git diff --cached --quiet; then
            git commit -m "chore: update data via GitHub Actions"
            git push -f
          else
            echo "No changes to commit."
          fi
