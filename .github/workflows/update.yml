name: Update TW Institutional Data

on:
  # 1. 定時排程 (GitHub 內建鬧鐘)
  schedule:
    # 盤中監控：每 15 分鐘 (UTC 01:00 ~ 05:59 / 台 09:00 ~ 13:59)
    - cron: "*/15 1-5 * * 1-5"
    # 盤後結算：下午 17:00 (UTC 09:00)
    - cron: "00 09 * * 1-5"

  # 2. 手動按鈕 (在 GitHub 網頁按 Run)
  workflow_dispatch: {}

  # 3. 🔥 外部遙控 (給 GAS 用的)
  # ⚠️ 修正：加入 run-weekly，確保週六集保大戶功能可被 GAS 觸發
  repository_dispatch:
    types: [run-now, run-weekly]

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 安裝必要套件
          pip install requests pandas openpyxl lxml html5lib yfinance playwright
          
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 只有在下午 17:00 的排程才安裝 Playwright (節省時間)
      - name: Install Playwright browsers
        if: github.event.schedule == '00 09 * * 1-5'
        run: |
          playwright install chromium
          playwright install-deps chromium

      # 🔥 修正：確認檔名為 update_all.py
      - name: Run update_all.py
        run: python update_all.py

      # (保留您的設定) 盤後跑券商分點
      - name: Run update_broker.py
        if: github.event.schedule == '00 09 * * 1-5'
        run: python update_broker.py

      # 提交變更 (確保資料能存檔，讓週六功能可以比對上週數據)
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: update data via GitHub Actions"
            git push
          else
            echo "No changes to commit."
          fi
