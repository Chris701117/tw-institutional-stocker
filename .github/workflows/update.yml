name: Update TW Institutional Data

on:
  # 1. 定時排程 (GitHub 內建鬧鐘)
  schedule:
    # 盤中監控：每 15 分鐘 (UTC 01:00 ~ 05:59)
    - cron: "*/15 1-5 * * 1-5"
    # 盤後結算：下午 17:00 (UTC 09:00)
    - cron: "00 09 * * 1-5"

  # 2. 手動按鈕 (在 GitHub 網頁按 Run)
  workflow_dispatch: {}

  # 3. 🔥 外部遙控 (給 GAS 用的) - 必須放在這裡，不能縮排進 schedule
  repository_dispatch:
    types: [run-now]

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 安裝所有必要套件 (含 yfinance)
          pip install requests pandas openpyxl lxml html5lib yfinance playwright
          
          # 如果有 requirements.txt 也安裝
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 只有在下午 17:00 的排程才安裝 Playwright (節省盤中時間)
      - name: Install Playwright browsers
        if: github.event.schedule == '00 09 * * 1-5'
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run update_all.py
        run: python update_all.py

      # 只有在下午 17:00 的排程才跑券商分點 (盤中跑也沒資料，浪費時間)
      # GAS 觸發時 (repository_dispatch) 也不會跑這個，符合極速需求
      - name: Run update_broker.py
        if: github.event.schedule == '00 09 * * 1-5'
        run: python update_broker.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: update data via GitHub Actions"
            git push -f
          else
            echo "No changes to commit."
          fi
