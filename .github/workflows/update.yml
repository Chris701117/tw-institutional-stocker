name: Update TW Institutional Data

on:
  schedule:
    # ---------------------------------------------------------
    # 盤中監控：每 15 分鐘跑一次 (極速衝刺模式)
    # ---------------------------------------------------------
    # UTC 01:00 ~ 05:59 (對應台北 09:00 ~ 13:59)
    # */15 代表每 15 分鐘觸發一次 (00, 15, 30, 45分)
    # 這是 GitHub 免費版的極限，再快容易卡死
    - cron: "*/15 1-5 * * 1-5"
    
    # ---------------------------------------------------------
    # 盤後結算：台16:30 (UTC 08:30) 抓證交所收盤資料
    # ---------------------------------------------------------
    - cron: "30 10 * * 1-5"

  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 🔥 關鍵修改：加入 yfinance (盤中抓價必備)
          # 保留您原本需要的 lxml, pandas, playwright 相關依賴
          pip install requests pandas openpyxl lxml html5lib yfinance
          
          # 如果您的 requirements.txt 裡面沒有 yfinance，這裡會自動補上
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 保留 Playwright (您的 update_broker.py 似乎需要它)
      - name: Install Playwright browsers
        run: |
          python -m pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run update_all.py
        run: python update_all.py

      - name: Run update_broker.py
        run: python update_broker.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 改為 add . 確保所有產生的 JSON 都被加入 (避免路徑錯誤漏檔)
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: update data via GitHub Actions"
            git push -f
          else
            echo "No changes to commit."
          fi
